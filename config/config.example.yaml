# moneyfly instance configuration.
#
# Every value below is optional — a missing config.yaml starts with these
# defaults. This file holds infrastructure only: accounts, categories and
# transactions live in moneyfly.db because they sync between devices.
#
# Copy to config.yaml and edit. Restart to apply (config is read at startup).

server:
  addr: ':8080'
  # Externally reachable origin. Required as soon as any OIDC provider is
  # configured, because the provider must be handed an absolute redirect URI.
  base_url: ''

app:
  # open   — anyone who can reach the instance may create an account
  # closed — no new accounts (set this after you have created yours)
  registration: open
  default_currency: EUR
  session_ttl_days: 365

sync:
  # How long the change_log keeps deltas. A device offline longer than this
  # re-bootstraps from /api/sync/snapshot instead of replaying — see docs/SYNC.md.
  change_log_retention_days: 90

fx:
  enabled: true
  refresh_at: '04:00'
  # Tried in order; the first that answers wins.
  providers:
    - open-er-api
    - fawazahmed0

# Any standards-compliant OIDC issuer works — nothing here is Google-specific.
# Each entry's client secret can instead be supplied as an environment variable
# MONEYFLY_OIDC_<ID>_CLIENT_SECRET (id upper-cased, '-' becomes '_'), which is
# what you want in Docker.
#
# The redirect URI to register with the provider is:
#   <base_url>/api/auth/oidc/<id>/callback
oidc: []
# oidc:
#   - id: google
#     name: Google
#     issuer: https://accounts.google.com
#     client_id: xxxxxxxx.apps.googleusercontent.com
#     client_secret: ''          # prefer MONEYFLY_OIDC_GOOGLE_CLIENT_SECRET
#     scopes: [openid, email, profile]
#
#   - id: authentik
#     name: Authentik
#     issuer: https://auth.example.com/application/o/moneyfly/
#     client_id: xxxxxxxx
