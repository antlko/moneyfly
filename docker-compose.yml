services:
  moneyfly:
    build:
      context: .
      args:
        VERSION: dev
    image: moneyfly:dev
    container_name: moneyfly
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      # config.yaml, moneyfly.db and exports all live here. Back up this one
      # directory and you have backed up everything.
      - ./config:/config
    environment:
      MONEYFLY_LOG_LEVEL: info
      # Required once OIDC providers are configured — it is the origin the
      # provider redirects back to.
      # MONEYFLY_BASE_URL: https://money.example.com
