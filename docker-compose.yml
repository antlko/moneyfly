# moneyfly — copy this file and run `docker compose up -d`,
# or paste it into Portainer → Stacks → Add stack.
services:
  moneyfly:
    image: ghcr.io/antlko/moneyfly:latest
    # To build from source instead of pulling the published image, comment out
    # `image:` above and uncomment these:
    # build:
    #   context: .
    #   args:
    #     VERSION: dev
    container_name: moneyfly
    restart: unless-stopped
    ports:
      - '5007:5007'
    volumes:
      # config.yaml, moneyfly.db and exports all live here. Back up this one
      # volume and you have backed up everything.
      - moneyfly-config:/config
    environment:
      MONEYFLY_LOG_LEVEL: info
      # Required once OIDC providers are configured — it is the origin the
      # provider redirects back to.
      # MONEYFLY_BASE_URL: https://money.example.com

volumes:
  moneyfly-config:
