version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint # errors are wrapped and matched with errors.Is, never by string
    - gocritic
    - misspell
    - noctx
    - revive
    - rowserrcheck # a forgotten rows.Err() hides a truncated result set
    - sqlclosecheck
    - unconvert
    - whitespace

  settings:
    misspell:
      # These are not typos. They are source names observed in the real Monefy
      # exports, and the whole point of the alias table is that they resolve.
      # "Correcting" them here would recreate the 14% silent loss.
      ignore-rules:
        - Studing
        - Clouth
        - Clouths
        - Toilery
        - Applience
        - esential
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]

  exclusions:
    rules:
      # Test files keep long literal SQL, deliberate typos in fixtures, and helper
      # requests whose bodies are closed by the shared decode/expectStatus helpers.
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gocritic
          - misspell
          - noctx
          - revive

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
