name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # backend/internal/web/dist/index.html is a tracked placeholder, there only so
  # `//go:embed all:dist` compiles in a fresh checkout. Committing a real build
  # over it is silently broken: `make build` and the Dockerfile both `rm -rf` the
  # directory first, so releases look fine, while `make dev-api` and a bare
  # `go build` serve an index.html whose hashed asset references 404 — a blank
  # app with nothing in the logs. That happened once; this is the guard.
  placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: dist/index.html is still the placeholder
        run: |
          if grep -q 'assets/' backend/internal/web/dist/index.html; then
            echo "backend/internal/web/dist/index.html references built assets."
            echo "It must stay the placeholder — restore it with:"
            echo "  git checkout \$(git log --diff-filter=A --format=%H -- backend/internal/web/dist/index.html | tail -1) -- backend/internal/web/dist/index.html"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npx oxlint .
      - run: npx eslint .
      - run: npm run test
      - run: npm run build-only

  image:
    # Proves the single-binary build still works end to end: SPA build → embed →
    # cross-compiled static binary. Runs only after both toolchains are green.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=${{ github.sha }}
