name: Publish Docker image

# Releases are cut by tag, not by push: `git tag v0.1.0 && git push origin v0.1.0`.
# CI already builds the image on every push to prove the single-binary path still
# works; this workflow is the only one that publishes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # QEMU is what makes the linux/arm64 leg possible. The Go stage
      # cross-compiles natively (CGO is off, the SQLite driver is pure Go), so
      # emulation only ever runs the distroless layer.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GLOGIN_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/antlko/moneyfly
          # `latest` is pinned to tag pushes deliberately. The usual
          # `enable={{is_default_branch}}` never fires under a `tags:` trigger,
          # which leaves README and compose telling people to pull a tag that
          # does not move.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Without this every published image reports its version as "dev":
          # the Dockerfile bakes VERSION into the binary via -ldflags -X.
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
